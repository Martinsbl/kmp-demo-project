product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $libs.compose.material.icons.core
  - $compose.ui
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation3.ui
  - $libs.compose.material3.adaptive.navigation3
  - $ktor.client.core
  - $ktor.client.contentNegotiation
  - $ktor.serialization.kotlinx.json

dependencies@jvm:
  - $ktor.client.okhttp

dependencies@android:
  - $ktor.client.okhttp
  - $compose.uiTooling

dependencies@ios:
  - $ktor.client.darwin

settings:
  kotlin:
    serialization: json
  ktor: enabled
  compose: enabled

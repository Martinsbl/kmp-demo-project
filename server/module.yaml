product: jvm/app

dependencies:
  - //core
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.server.cors
  - $ktor.server.callLogging
  - $ktor.serialization.kotlinx.json
  - $libs.logback.classic

settings:
  kotlin:
    serialization: json
  ktor: enabled
  jvm:
    mainClass: org.example.demo.server.ApplicationKt

test-dependencies:
  - $ktor.server.testHost

plugins:
  ktlint: enabled
